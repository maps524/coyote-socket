name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust suite + golden fixtures
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      # `tauri::generate_context!` reads `frontendDist` at compile time and
      # panics if it is missing, so the frontend has to be built before the
      # Rust crate will even compile — including for tests.
      - name: Build frontend
        run: npm run build

      # This also rewrites docs/spikes/pwa/fixtures: `generate_golden_fixtures`
      # is a #[test] that emits the whole folder. The diff check below is what
      # turns that into a regression guard.
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Golden fixtures match the committed traces
        id: fixtures
        run: |
          git diff --exit-code -- docs/spikes/pwa/fixtures
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $untracked = git ls-files --others --exclude-standard -- docs/spikes/pwa/fixtures
          if ($untracked) {
            Write-Host "::error::New fixture files were generated but not committed:"
            $untracked | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: Explain a fixture mismatch
        if: failure() && steps.fixtures.outcome == 'failure'
        run: |
          Write-Host "::error::Regenerated golden traces differ from the committed ones."
          Write-Host "The engine's behaviour changed. If that was intended, run"
          Write-Host "  cargo test --manifest-path src-tauri/Cargo.toml golden"
          Write-Host "locally, review every changed tick, and commit the result."
          Write-Host "These fixtures are the correctness contract for the TypeScript port."
          git --no-pager diff --stat -- docs/spikes/pwa/fixtures
